- name: Set up the KVM hypervisor
  hosts: hypervisor
  become: true

  tasks:
    - name: Install KVM and libvirt
      ansible.builtin.apt:
        name:
          - qemu-system-x86
          - libvirt-daemon-system
          - virtinst
          - ovmf
          - python3-libvirt
          - python3-lxml
          - xorriso
        update_cache: true

    - name: Add the HashiCorp apt repository
      ansible.builtin.deb822_repository:
        name: hashicorp
        uris: https://apt.releases.hashicorp.com
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: https://apt.releases.hashicorp.com/gpg

    - name: Install Packer
      ansible.builtin.apt:
        name: packer
        update_cache: true

    - name: Allow the user manage VMs without sudo
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: libvirt
        append: true

    - name: Define the PXE network
      community.libvirt.virt_net:
        name: pxe
        state: present
        xml: |
          <network>
            <name>pxe</name>
            <bridge name="virbr-pxe"/>
          </network>

    - name: Start the PXE network
      community.libvirt.virt_net:
        name: pxe
        state: active

    - name: Start the PXE network on boot
      community.libvirt.virt_net:
        name: pxe
        autostart: true

    - name: Start the NAT network
      community.libvirt.virt_net:
        name: default
        state: active

    - name: Start the NAT network on boot
      community.libvirt.virt_net:
        name: default
        autostart: true

    - name: Copy the SSH public key for the lab VMs
      ansible.builtin.copy:
        src: "{{ ansible_ssh_private_key_file }}.pub"
        dest: /var/lib/libvirt/ssh-key.pub
        mode: "0644"
