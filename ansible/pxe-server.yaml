- name: Configure the PXE server
  hosts: pxe_server
  become: true

  tasks:
    - name: Set the address on the PXE network
      ansible.builtin.copy:
        dest: /etc/systemd/network/20-pxe.network
        content: |
          [Match]
          MACAddress=52:54:00:10:00:01

          [Network]
          Address=10.0.0.1/24
          # Route the clients to the internet: the netboot installer downloads its disk drivers
          IPMasquerade=ipv4
      notify: Reload network

    - name: Apply the network config before starting the services
      ansible.builtin.meta: flush_handlers

    - name: Create the dnsmasq config directory
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        mode: "0755"

    - name: Configure dnsmasq for DHCP, DNS and TFTP on the PXE network
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/pxe.conf
        content: |
          # DHCP and DNS server, DNS queries go to the server's own resolver
          no-resolv
          server=127.0.0.53
          listen-address=10.0.0.1
          bind-dynamic
          dhcp-range=10.0.0.100,10.0.0.200,12h

          # Fixed addresses of the clients, outside the range
          {% for host in groups['pxe_client'] %}
          dhcp-host={{ hostvars[host].mac }},{{ hostvars[host].ansible_host }}
          {% endfor %}

          # Firmware PXE gets iPXE over TFTP, iPXE gets the script over HTTP
          dhcp-match=set:ipxe,175
          dhcp-boot=tag:!ipxe,ipxe.efi
          dhcp-boot=tag:ipxe,http://10.0.0.1/boot.ipxe

          # TFTP server
          enable-tftp
          tftp-root=/srv/tftp
      notify: Restart dnsmasq

    - name: Install dnsmasq, iPXE and nginx
      ansible.builtin.apt:
        name:
          - dnsmasq
          - ipxe
          - nginx
          - iputils-ping
        update_cache: true

    - name: Create the TFTP and HTTP roots
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /srv/tftp
        - /srv/http
        - /srv/http/hosts
        - /srv/http/installer

    - name: Mount the images folder shared by the hypervisor
      ansible.posix.mount:
        src: images
        path: /srv/http/images
        fstype: virtiofs
        state: mounted

    - name: Download the Debian netboot installer
      ansible.builtin.get_url:
        url: "https://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images/netboot/debian-installer/amd64/{{ item }}"
        dest: "/srv/http/installer/{{ item }}"
        mode: "0644"
      loop:
        - linux
        - initrd.gz

    - name: Copy the iPXE UEFI binary to the TFTP root
      ansible.builtin.copy:
        src: /usr/lib/ipxe/ipxe.efi
        dest: /srv/tftp/ipxe.efi
        remote_src: true
        mode: "0644"

    - name: Copy the iPXE scripts and the preseed to the HTTP root
      ansible.builtin.copy:
        src: files/http/
        dest: /srv/http/
        mode: "0644"

    - name: Configure nginx to serve the HTTP root
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              root /srv/http;
              autoindex on;
          }
      notify: Reload nginx

    - name: Enable and start dnsmasq and nginx
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - dnsmasq
        - nginx

  handlers:
    - name: Reload network
      ansible.builtin.command: networkctl reload

    - name: Restart dnsmasq
      ansible.builtin.systemd_service:
        name: dnsmasq
        state: restarted

    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
