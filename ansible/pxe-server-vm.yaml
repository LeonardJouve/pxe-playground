- name: Create the PXE server VM
  hosts: hypervisor
  become: true

  tasks:
    - name: Download the Debian cloud image
      ansible.builtin.get_url:
        url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
        dest: /var/lib/libvirt/images/debian-13.qcow2

    - name: Create the VM disk from the cloud image
      ansible.builtin.command:
        cmd: >
          qemu-img create -f qcow2 -F qcow2
          -b /var/lib/libvirt/images/debian-13.qcow2
          /var/lib/libvirt/images/pxe-server.qcow2 10G
        creates: /var/lib/libvirt/images/pxe-server.qcow2

    - name: Create the VM
      ansible.builtin.command:
        cmd: >
          virt-install
          --name pxe-server
          --vcpus 1
          --memory 1024
          --disk /var/lib/libvirt/images/pxe-server.qcow2
          --import
          --boot uefi
          --osinfo linux2022
          --network network=default
          --network network=pxe
          --cloud-init clouduser-ssh-key=/var/lib/libvirt/ssh-key.pub
          --graphics none
          --noautoconsole
        creates: /etc/libvirt/qemu/pxe-server.xml
