- name: Build the disk image
  hosts: hypervisor
  become: true

  tasks:
    - name: Copy the Packer template
      ansible.builtin.copy:
        src: ../packer/
        dest: /var/lib/pxe-images/

    - name: Install the Packer plugins
      ansible.builtin.command:
        cmd: packer init .
        chdir: /var/lib/pxe-images
      changed_when: false

    - name: Build the image
      ansible.builtin.command:
        cmd: packer build -force .
        chdir: /var/lib/pxe-images
        creates: /var/lib/pxe-images/output/debian.raw.gz
