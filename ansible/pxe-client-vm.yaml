- name: Create a PXE client VM
  hosts: hypervisor
  become: true

  tasks:
    - name: Create the VM disk from the Packer image
      ansible.builtin.shell:
        cmd: gunzip -c /var/lib/pxe-images/output/debian.raw.gz > /var/lib/libvirt/images/pxe-client.raw
        creates: /var/lib/libvirt/images/pxe-client.raw

    - name: Create the VM
      ansible.builtin.command:
        cmd: >
          virt-install
          --name pxe-client
          --vcpus 1
          --memory 2048
          --disk /var/lib/libvirt/images/pxe-client.raw,format=raw
          --import
          --boot uefi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=no,hd,network
          --osinfo linux2022
          --network network=pxe,mac={{ hostvars['pxe-client'].mac }}
          --graphics none
          --noautoconsole
        creates: /etc/libvirt/qemu/pxe-client.xml
